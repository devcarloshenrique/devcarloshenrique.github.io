baseURL = 'https://carloshenrique.app/'
defaultContentLanguage = 'pt'
title = 'Carlos Henrique — Portfólio & Tech Blog'
enableRobotsTXT = true

[languages.pt]
  locale = 'pt-BR'
  label = 'Português'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github-dark'
    lineNos = false
    codeFences = true

[params]
  author = 'Carlos Henrique Carvalho de Araujo'
  shortName = 'Carlos Henrique'
  role = 'Software Engineer • BNB'
  currentRole = 'Desenvolvedor Full Stack no Banco do Nordeste do Brasil (BNB)'
  location = 'Fortaleza - CE, Brasil'
  email = 'devcarloshenrique@gmail.com'
  github = 'https://github.com/devcarloshenrique'
  linkedin = 'https://www.linkedin.com/in/devcarloshenrique/'
  avatar = '/perfil.png'
  avatarFallback = 'https://avatars.githubusercontent.com/u/49603590?v=4'
  formspreeID = 'meaqneva'
  description = 'Portfólio moderno de Engenharia de Software e Blog Técnico com projetos de alto impacto, arquitetura e curadoria de conteúdo.'

[[menus.main]]
  name = 'Sobre'
  pageRef = '/'
  weight = 1

[[menus.main]]
  name = 'Projetos'
  pageRef = '/projects/'
  weight = 2

[[menus.main]]
  name = 'Snippets & Blog'
